      .num { font-variant-numeric: tabular-nums; }

      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details[open] > summary .chev { transform: rotate(180deg); }

      .tl-row { display: grid; grid-template-columns: 15rem repeat(7, minmax(7.5rem, 1fr)); border-top: 1px solid rgb(255 255 255 / 0.06); }
      .tl-head { border-top: 0; background: rgb(255 255 255 / 0.02); }

      .tl-item:hover { border-color: rgb(255 255 255 / 0.2); }
      .tl-item.is-done { opacity: 0.55; }
      .tl-gap { display: block; width: 100%; height: 2px; border-radius: 999px; background: rgb(255 255 255 / 0.05); }

      .toast { display: flex; align-items: flex-start; gap: 0.65rem; border-radius: 1rem; border: 1px solid rgb(255 255 255 / 0.1); background: rgb(18 20 26 / 0.95); padding: 0.8rem 1rem; box-shadow: 0 20px 50px -18px rgb(0 0 0 / 0.9); font-size: 0.875rem; line-height: 1.45; color: rgb(228 228 231); }

    }
  </style>
  <style>
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
    /* Entrance animation runs only when a page is entered, never on in-page re-renders. */
    .view-enter .rise, .rise-now { animation: rise 0.35s ease-out both; }
    .shake { animation: shake 0.45s ease-in-out; }
    .toast { animation: rise 0.3s ease-out both; }
    #toast-root { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; display: flex; flex-direction: column; gap: 0.5rem; width: min(92vw, 24rem); }
    #print-root { display: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    @media print {
      @page { size: A4; margin: 14mm; }
      html, body { background: #fff !important; }
      html { color-scheme: light; }
      #app, #modal-root, #toast-root { display: none !important; }
      #print-root { display: block !important; }
    }
  </style>

  async function copyText(text) {

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.append(ta);
      ta.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();

        </form>

      </div>
    </div>`;
  }
  function paintPin() {
    const input = $('#pin');
    if (!input) return;
    const n = input.value.length;
    const focused = document.activeElement === input;
    $$('#pin-cells .pin-cell').forEach((cell, i) => {
      cell.textContent = i < n ? '•' : '';
      cell.classList.toggle('is-filled', i < n);
      cell.classList.toggle('is-active', focused && i === Math.min(n, 5));
    });
  }
  function showLoginMessage(msg, shake = true) {
    const m = $('#login-msg');
    if (m) m.textContent = msg;
    const form = $('#login-form');
    if (shake && form && msg) {
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
    }
  }
  function lockoutTick() {
    clearInterval(lockTimer);
    lockTimer = null;
    const input = $('#pin');
    const btn = $('#login-btn');
    if (!input || !btn) return;
    const update = () => {
      const left = Math.ceil((auth.lockUntil - Date.now()) / 1000);
      const locked = left > 0;
      input.disabled = locked;
      btn.disabled = locked;
      if (locked) showLoginMessage(`Too many incorrect attempts. Try again in ${left}s.`, false);
      else {
        const m = $('#login-msg');
        if (m && m.textContent.startsWith('Too many')) showLoginMessage('', false);
      }
      return locked;
    };
    if (update()) {
      lockTimer = setInterval(() => {
        if (!update()) {
          clearInterval(lockTimer);
          lockTimer = null;
          $('#pin')?.focus();
        }
      }, 1000);
    } else {
      input.focus({ preventScroll: true });
    }
  }
  async function onLoginSubmit() {
    if (busy || !auth) return;
    const input = $('#pin');
    const pin = String(input?.value || '').trim();
    if (!PIN_RE.test(pin)) { showLoginMessage('Enter your 6-character PIN (letters and numbers).'); return; }
    busy = true;
    const btn = $('#login-btn');
    if (btn) btn.disabled = true;
    let res;
    try {
      res = await tryUnlock(pin);
    } catch {
      res = { ok: false, msg: 'Could not verify the PIN in this browser. Check that storage is enabled, then reload.' };
    }
    busy = false;
    if (res.ok) {
      renderApp();
      toast('Welcome back.');
      return;
    }
    if (input) input.value = '';
    showLoginMessage(res.msg);
    lockoutTick();
    paintPin();
  }

  function refreshPreview(scopeEl) {
    const s = draftOf(scopeEl.dataset.splitScope);
    if (!s) return;
    const prev = $('[data-split-preview]', scopeEl);
    if (prev) prev.innerHTML = sheetHTML(s);
    const warn = $('[data-split-warn]', scopeEl);
    if (warn) warn.innerHTML = warnHTML(s);
    const m = $('[data-total="master"]', scopeEl);
    if (m) m.innerHTML = totalChip(masterTotal(s));
    const p = $('[data-total="publishing"]', scopeEl);
    if (p) p.innerHTML = totalChip(pubTotal(s));
    icons();

  function refreshScope(scope) {
    const el = $(`[data-split-scope="${scope}"]`);
    const s = draftOf(scope);
    if (!el || !s) return;
    const holder = $('[data-split-form]', el);
    if (holder) holder.innerHTML = splitFormHTML(scope, s);
    refreshPreview(el);
    icons();
  }
  function splitInput(scopeEl, t) {
    const scope = scopeEl.dataset.splitScope;
    const s = draftOf(scope);
    if (!s) return;
    if (t.dataset.writer !== undefined) {
      const w = s.writers[Number(t.dataset.writer)];
      if (!w) return;
      if (t.dataset.k === 'name') w.name = str(t.value, 80);
      else w.pct = num(t.value, 0);
    } else {
      const f = t.dataset.f;
      if (f === 'master.artist') s.master.artist = num(t.value, 0);
      else if (f === 'master.producer') s.master.producer = num(t.value, 0);
      else if (f === 'master.label') s.master.label = num(t.value, 0);
      else if (f === 'date') s.date = isoOk(t.value);
      else if (SPLIT_TEXT[f]) s[f] = str(t.value, SPLIT_TEXT[f]);
      else return;
    }
    touchDraft(scope);
    refreshPreview(scopeEl);
  }
  function saveInlineSplit() {
    const blockers = splitBlockers(db.draft);
    if (blockers.length) return toast(blockers[0], 'error');
    const now = new Date().toISOString();
    const rec = { ...clone(db.draft), id: uid(), createdAt: now, updatedAt: now };
    db.splits.push(rec);
    db.draft = blankSplit();
    saveDb();
    renderView();
    toast(`Split sheet saved: ${rec.track}.`);
  }
  function openSplitModal(id) {
    const s = db.splits.find((x) => x.id === id);

    modalDraft = clone(s);

    openModal({
      title: 'Edit split sheet',
      subtitle: `${s.track || 'Untitled track'} · changes save to the archive when you click Save changes.`,
      form: 'split-edit',
      wide: true,
      body: `

  function checkItem(r, c) {
    const due = dueOf(r, c);

    return `

        <span class="text-zinc-500"> · ${fmtDate(due)}${late ? ' · overdue' : ''}</span>
        <br />${esc(c.label)}
      </span>
    </label>`;

  function timelineHTML() {
    const list = db.releases.slice().sort(byDate);

  function tlRow(r) {
    const cd = countdownInfo(r);
    const cells = TIMELINE.map((t) => {
      if (!t.key) return '<div class="tl-cell"><span class="tl-gap"></span></div>';
      const c = CHECKS.find((x) => x.key === t.key);
      const checked = !!r.checks?.[c.key];
      return `
        <div class="tl-cell">
          <label class="tl-item${checked ? ' is-done' : ''}" title="${esc(c.label)}">
            <input type="checkbox" class="check mt-0.5" data-change="release-check" data-id="${r.id}" data-key="${c.key}"${checked ? ' checked' : ''} aria-label="${esc(c.week)}: ${esc(c.label)}" />

    return `

      <div class="min-w-0 px-4 py-3">

      </div>
      ${cells}
    </div>`;
  }

  function updateTemplate(tpl) {
    const f = formData(tpl);
    if (tpl.dataset.tpl === 'spotify') {
      const out = $('#tpl-spotify', tpl);
      if (out) out.value = spotifyText({
        artist: str(f.artist, 80), track: str(f.track, 120), date: isoOk(f.date),
        genres: $$('input[name="genre"]:checked', tpl).map((i) => i.value),
        impact: str(f.impact, 600), traction: str(f.traction, 600), signals: str(f.signals, 600), sender: str(f.sender, 120),
      });
    } else if (tpl.dataset.tpl === 'booking') {
      const fee = Math.max(0, Math.round(Number(f.fee) || 0));
      const pct = Math.min(100, Math.max(0, Number(f.pct) || 0));
      const deposit = Math.round((fee * pct) / 100);
      const set = (id, text) => { const el = $(`#${id}`, tpl); if (el) el.textContent = text; };
      set('bk-deposit', fee ? fmtUGX(deposit) : 'Enter a fee');
      set('bk-balance', fee ? fmtUGX(fee - deposit) : 'Enter a fee');
      const out = $('#tpl-booking', tpl);
      if (out) out.value = bookingText({
        artist: str(f.artist, 80), venue: str(f.venue, 120), date: isoOk(f.date), fee, pct,
        set: Math.max(0, Math.round(Number(f.set) || 0)), balanceWhen: str(f.balanceWhen, 120),
      });
    }
  }

  function exportBackup() {
    const payload = { app: '7h-manager', schema: 1, exportedAt: new Date().toISOString(), data: db };
    downloadFile(`7h-manager-backup-${todayISO()}.json`, 'application/json', JSON.stringify(payload, null, 2));
    toast('Backup downloaded. Keep it somewhere safe.');
  }
  function importBackup(input) {
    const file = input.files?.[0];
    input.value = '';
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) return toast('That file is too large to be a 7H Manager backup.', 'error');
    const reader = new FileReader();
    reader.onload = () => {
      let parsed = null;
      try { parsed = JSON.parse(String(reader.result)); } catch { parsed = null; }
      if (!parsed || parsed.app !== '7h-manager' || !parsed.data || typeof parsed.data !== 'object') {
        return toast('That file is not a 7H Manager backup.', 'error');
      }
      confirmBox({
        title: 'Restore this backup?',
        message: 'This replaces all data currently stored in this browser.',
        confirmText: 'Restore backup',
        danger: true,
        onYes: () => { db = normalizeData(parsed.data); saveDb(); renderView(); toast('Backup restored.'); },
      });
    };
    reader.onerror = () => toast('The file could not be read.', 'error');
    reader.readAsText(file);
  }

        title: 'Delete contact?', confirmText: 'Delete', danger: true,
        message: 'This removes the contact from your directory. The organisation itself is not affected.',
        onYes: () => { db.contacts = db.contacts.filter((c) => c.id !== id); saveDb(); renderView(); toast('Contact deleted.'); },
      });
    },
    'split-save': () => saveInlineSplit(),
    'split-reset': () => confirmBox({
      title: 'Clear the generator?', confirmText: 'Clear form', danger: true,
      message: 'This clears the form on this page. Saved sheets in the archive are not affected.',
      onYes: () => { db.draft = blankSplit(); saveDb(); renderView(); toast('Form cleared.'); },
    }),
    'split-print': (el) => printSheet(sheetHTML(draftOf(el.dataset.scope))),
    'split-print-modal': () => { if (modalDraft) printSheet(sheetHTML(modalDraft)); },
    'split-print-id': (el) => { const s = db.splits.find((x) => x.id === el.dataset.id); if (s) printSheet(sheetHTML(s)); },
    'split-download': (el) => downloadSheet(draftOf(el.dataset.scope)),
    'split-copy': (el) => copyText(sheetText(draftOf(el.dataset.scope))),
    'split-edit': (el) => openSplitModal(el.dataset.id),
    'split-delete': (el) => {
      const id = el.dataset.id;
      confirmBox({
        title: 'Delete split sheet?', confirmText: 'Delete', danger: true,
        message: 'This removes the saved split sheet from the archive. This cannot be undone.',
        onYes: () => { db.splits = db.splits.filter((s) => s.id !== id); saveDb(); renderView(); toast('Split sheet deleted.'); },
      });
    },
    'split-add-writer': (el) => {
      const scope = el.dataset.scope;
      const s = draftOf(scope);
      if (!s || s.writers.length >= 12) return;
      s.writers.push({ name: '', pct: 0 });
      touchDraft(scope);
      refreshScope(scope);
    },
    'split-remove-writer': (el) => {
      const scope = el.dataset.scope;
      const s = draftOf(scope);
      const i = Number(el.dataset.i);
      if (!s || s.writers.length < 2 || !s.writers[i]) return;
      s.writers.splice(i, 1);
      touchDraft(scope);
      refreshScope(scope);
    },
    'copy-from': (el) => copyText($(`#${el.dataset.from}`)?.value || ''),
    'export-backup': () => exportBackup(),
    'restore-sample': () => confirmBox({
      title: 'Restore sample data?', confirmText: 'Restore sample', danger: true,
      message: 'This replaces everything in this browser with the sample roster, releases, demos and contacts.',
      onYes: () => { db = seedData(); saveDb(); renderView(); toast('Sample data restored.'); },
    }),
    'erase-all': () => confirmBox({
      title: 'Erase all data?', confirmText: 'Erase everything', danger: true,
      message: 'This permanently removes the roster, releases, demos, split sheets and contacts from this browser. Download a backup first if you need it.',
      onYes: () => { db = emptyData(); saveDb(); renderView(); toast('All data erased.'); },
    }),
  };

  function onClick(e) {
    if (!(e.target instanceof Element)) return;
    if (e.target.closest('#pin-cells')) { $('#pin')?.focus(); return; }
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el, e);
  }
  function onInput(e) {
    const t = e.target;
    if (!(t instanceof Element)) return;
    if (t.id === 'pin') {
      t.value = t.value.replace(/[^A-Za-z0-9]/g, '').slice(0, 6);
      return paintPin();
    }
    if (t.dataset.search === 'demos') {
      demoQuery = t.value;
      return updateDemos();
    }
    const scopeEl = t.closest('[data-split-scope]');
    if (scopeEl && (t.dataset.f || t.dataset.writer !== undefined)) return splitInput(scopeEl, t);
    const tpl = t.closest('[data-tpl]');
    if (tpl) updateTemplate(tpl);
  }
  function onChange(e) {
    const t = e.target;
    if (!(t instanceof Element)) return;
    const tpl = t.closest('[data-tpl]');
    if (tpl) updateTemplate(tpl);
    const k = t.dataset.change;
    if (!k) return;
    const id = t.dataset.id;
    if (k === 'artist-contract') {
      const a = db.roster.find((x) => x.id === id);
      if (a) {
        a.contract = pick(t.value, CONTRACT_STATUSES, a.contract);
        saveDb();
        renderView();
        toast(`${a.name}: contract set to ${a.contract}.`);
      }
    } else if (k === 'artist-notes') {
      const a = db.roster.find((x) => x.id === id);
      if (a) { a.notes = str(t.value, 2000); saveDb(); toast('Roster note saved.'); }
    } else if (k === 'release-check') {
      const r = db.releases.find((x) => x.id === id);
      if (r) { r.checks[t.dataset.key] = t.checked; saveDb(); renderView(); }
    } else if (k === 'release-status') {
      const r = db.releases.find((x) => x.id === id);
      if (r) {
        r.status = pick(t.value, RELEASE_STATUSES, r.status);
        saveDb();
        renderView();
        toast(`${r.title} moved to ${r.status}.`);
      }
    } else if (k === 'demo-status') {
      const d = db.demos.find((x) => x.id === id);
      if (d) {
        d.status = pick(t.value, DEMO_STATUSES, d.status);
        saveDb();
        updateDemos();
        updateNav(currentRoute());
        toast(`${d.artist}: ${d.status}.`);
      }
    } else if (k === 'demo-notes') {
      const d = db.demos.find((x) => x.id === id);
      if (d) { d.notes = str(t.value, 2000); saveDb(); toast('Demo notes saved.'); }
    } else if (k === 'split-status') {
      const s = db.splits.find((x) => x.id === id);
      if (s) {
        s.status = pick(t.value, SPLIT_STATUSES, s.status);
        s.updatedAt = new Date().toISOString();
        saveDb();
        renderView();
      }
    } else if (k === 'import-file') {
      importBackup(t);
    }
  }
  function onSubmit(e) {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;
    if (form.id === 'login-form') { e.preventDefault(); onLoginSubmit(); return; }
    if (form.dataset.tpl) { e.preventDefault(); return; }
    if (form.dataset.form) {
      e.preventDefault();
      const fn = FORMS[form.dataset.form];
      if (fn) fn(form);
    }
  }
  function onKeydown(e) {
    touchSession();
    if (e.key === 'Escape') {
      if (isModalOpen()) closeModal();
      else if (navOpen) setNav(false);
    } else if (e.key === 'Tab' && isModalOpen()) {
      trapFocus(e);
    }
  }
  function onToggle(e) {
    const d = e.target;
    if (d instanceof HTMLDetailsElement && d.dataset.acc) detailsState[d.dataset.acc] = d.open;
  }
  function onStorage(e) {
    if (e.key === AUTH_KEY) {
      auth = readAuth() || auth;
      if (isUnlocked() !== shellReady) renderApp();
    } else if (e.key === DATA_KEY && e.newValue) {
      try {
        db = normalizeData(JSON.parse(e.newValue));
        if (shellReady) renderView();
      } catch { /* ignore malformed writes from other tabs */ }
    }
  }

  /* Drag and drop for the release board */
  function onDragStart(e) {
    const card = e.target.closest?.('[data-drag-release]');
    if (!card) return;
    dragId = card.dataset.dragRelease;
    e.dataTransfer?.setData('text/plain', dragId);
    if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
    requestAnimationFrame(() => card.classList.add('is-dragging'));
  }
  function onDragOver(e) {
    const col = e.target.closest?.('[data-drop-status]');
    if (!col || !dragId) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    $$('.drop-col.drop-hover').forEach((c) => { if (c !== col) c.classList.remove('drop-hover'); });
    col.classList.add('drop-hover');
  }
  function onDragLeave(e) {
    const col = e.target.closest?.('[data-drop-status]');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop-hover');
  }
  function onDrop(e) {
    const col = e.target.closest?.('[data-drop-status]');
    if (!col || !dragId) return;
    e.preventDefault();
    const st = col.dataset.dropStatus;
    const r = db.releases.find((x) => x.id === dragId);
    dragId = null;
    if (r && RELEASE_STATUSES.includes(st) && r.status !== st) {
      r.status = st;
      saveDb();
      renderView();
      toast(`${r.title} moved to ${st}.`);
    } else {
      renderView();
    }
  }
  function onDragEnd() {
    dragId = null;
    $$('.release-card.is-dragging').forEach((c) => c.classList.remove('is-dragging'));
    $$('.drop-col.drop-hover').forEach((c) => c.classList.remove('drop-hover'));
  }

  function bindEvents() {
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('keydown', onKeydown);
    document.addEventListener('focusin', (e) => { if (e.target.id === 'pin') paintPin(); });
    document.addEventListener('focusout', (e) => { if (e.target.id === 'pin') paintPin(); });
    document.addEventListener('toggle', onToggle, true);
    document.addEventListener('pointerdown', touchSession, { passive: true });
    document.addEventListener('dragstart', onDragStart);
    document.addEventListener('dragover', onDragOver);
    document.addEventListener('dragleave', onDragLeave);
    document.addEventListener('drop', onDrop);
    document.addEventListener('dragend', onDragEnd);
    window.addEventListener('hashchange', () => {
      if (shellReady && isUnlocked()) { setNav(false); renderView(); }
    });
    window.addEventListener('storage', onStorage);
    setInterval(tick, 15000);
  }

  /* =====================================================================
     Boot
     ===================================================================== */
  async function boot() {
    const style = document.createElement('style');
    style.textContent = SHEET_CSS;
    document.head.append(style);
    db = loadData();
    try {
      await ensureAuth();
    } catch {
      $('#app').innerHTML = `
        <div class="grid min-h-screen place-items-center px-6">
          <div class="card max-w-md p-8 text-center">
            <h1 class="font-display text-xl font-bold text-zinc-50">A secure context is required</h1>
            <p class="mt-3 text-sm leading-relaxed text-zinc-400">7H Manager checks the PIN with Web Crypto, which only runs over HTTPS or on localhost. Open the deployed HTTPS link, or run the app on localhost.</p>
          </div>
        </div>`;
      return;
    }
    if (!storeGet(DATA_KEY) || pendingNotice) saveDb();
    bindEvents();
    if (!location.hash) history.replaceState(null, '', '#/overview');
    renderApp();
    if (pendingNotice) {
      toast(pendingNotice, 'error');
      pendingNotice = '';
    }
  }

  boot();
})();
</script>
</body>
</html>
